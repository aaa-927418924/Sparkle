<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Sparkle - オプション</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #222;
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 14px;
        padding: 28px 32px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 20px;
      }
      .section {
        margin-bottom: 20px;
      }
      .section label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .section p {
        font-size: 14px;
        margin: 0 0 8px;
        line-height: 1.6;
      }
      a {
        color: #d97757;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      kbd {
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 13px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Sparkle 設定</h1>

      <div class="section">
        <label>ショートカットキー</label>
        <p>
          スクリーンショットを撮って拡張機能を開くショートカットキーは、
          Chrome の拡張機能管理画面から変更できます。
        </p>
        <p>
          <a id="shortcutsLink" href="#">chrome://extensions/shortcuts を開く</a>
        </p>
        <p style="font-size:13px; color:#888;">
          現在の設定: <kbd id="currentShortcut">Ctrl+Y</kbd>
        </p>
      </div>

      <hr style="border:none; border-top:1px solid #eee; margin:20px 0;" />

      <div class="section">
        <label>保存先サーバー</label>
        <p>
          バックエンドサーバーが <code>http://127.0.0.1:8000</code>
          で起動している必要があります。
        </p>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
