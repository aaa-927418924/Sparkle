<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Sparkle - オプション</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #18181b;
        margin: 0;
        padding: 40px 20px;
        color: #f4f3ee;
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        background: #232327;
        border: 1px solid #3f3f42;
        border-radius: 14px;
        padding: 28px 32px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 20px;
        color: #f4f3ee;
      }
      .section {
        margin-bottom: 20px;
      }
      .section label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #f4f3ee;
      }
      .section p {
        font-size: 14px;
        margin: 0 0 8px;
        line-height: 1.6;
        color: #d5d1c8;
      }
      a {
        color: #d77a50;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      kbd {
        background: #18181b;
        border: 1px solid #3f3f42;
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 13px;
        font-family: monospace;
        color: #f4f3ee;
      }
      hr {
        border: none;
        border-top: 1px solid #3f3f42;
        margin: 20px 0;
      }
      code {
        background: #18181b;
        border: 1px solid #3f3f42;
        border-radius: 4px;
        padding: 1px 5px;
        color: #f0b69a;
      }
      .muted {
        color: #b1ada1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Sparkle 設定</h1>

      <div class="section">
        <label>ショートカットキー</label>
        <p>
          スクリーンショットを撮って拡張機能を開くショートカットキーは、
          Chrome の拡張機能管理画面から変更できます。
        </p>
        <p>
          <a id="shortcutsLink" href="#">chrome://extensions/shortcuts を開く</a>
        </p>
        <p class="muted" style="font-size:13px;">
          現在の設定: <kbd id="currentShortcut">Ctrl+Y</kbd>
        </p>
      </div>

      <hr style="border:none; border-top:1px solid #3f3f42; margin:20px 0;" />

      <div class="section">
        <label>保存先サーバー</label>
        <p>
          バックエンドサーバーが <code>http://127.0.0.1:8000</code>
          で起動している必要があります。
        </p>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
