<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Sparkle - オプション</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #18181b;
        margin: 0;
        padding: 40px 20px;
        color: #f4f3ee;
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        background: #232327;
        border: 1px solid #3f3f42;
        border-radius: 14px;
        padding: 28px 32px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 20px;
        color: #f4f3ee;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 8px;
        color: #f4f3ee;
      }
      .section {
        margin-bottom: 20px;
      }
      .section label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #f4f3ee;
      }
      .section p {
        font-size: 14px;
        margin: 0 0 8px;
        line-height: 1.6;
        color: #d5d1c8;
      }
      a {
        color: #d77a50;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      kbd {
        background: #18181b;
        border: 1px solid #3f3f42;
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 13px;
        font-family: monospace;
        color: #f4f3ee;
      }
      hr {
        border: none;
        border-top: 1px solid #3f3f42;
        margin: 20px 0;
      }
      code {
        background: #18181b;
        border: 1px solid #3f3f42;
        border-radius: 4px;
        padding: 1px 5px;
        color: #f0b69a;
      }
      .muted {
        color: #b1ada1;
      }
      .check-row {
        display: flex !important;
        align-items: flex-start;
        gap: 8px;
        margin: 10px 0 0;
        font-size: 14px !important;
        font-weight: 500 !important;
        line-height: 1.5;
        cursor: pointer;
      }
      .check-row input {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        margin: 2px 0 0;
        accent-color: #d77a50;
      }
      .check-row input:disabled {
        opacity: 0.6;
      }
      .check-row input:focus-visible,
      .template-delete:focus-visible {
        outline: 2px solid #f0b69a;
        outline-offset: 2px;
      }
      .template-count {
        margin: 14px 0 8px !important;
      }
      .template-list {
        display: grid;
        gap: 8px;
      }
      .template-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border: 1px solid #3f3f42;
        border-radius: 8px;
        background: #18181b;
      }
      .template-item-main {
        min-width: 0;
        flex: 1 1 auto;
      }
      .template-item-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #f4f3ee;
        font-size: 14px;
        font-weight: 700;
      }
      .template-item-meta {
        margin-top: 3px;
        overflow-wrap: anywhere;
        color: #b1ada1;
        font-size: 12px;
        line-height: 1.45;
      }
      .template-delete {
        flex: 0 0 auto;
        padding: 5px 8px;
        border: 1px solid #5a514b;
        border-radius: 6px;
        background: transparent;
        color: #f0b69a;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .template-delete:hover {
        background: rgba(215, 122, 80, 0.16);
      }
      .template-empty {
        padding: 12px;
        border: 1px dashed #3f3f42;
        border-radius: 8px;
        color: #b1ada1;
        font-size: 13px;
      }
      .option-status {
        margin-top: 10px;
        color: #6ee7a8;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Sparkle 設定</h1>

      <div class="section">
        <label>ショートカットキー</label>
        <p>
          スクリーンショットを撮って拡張機能を開くショートカットキーは、
          Chrome の拡張機能管理画面から変更できます。
        </p>
        <p>
          <a id="shortcutsLink" href="#">chrome://extensions/shortcuts を開く</a>
        </p>
        <p class="muted" style="font-size:13px;">
          現在の設定: <kbd id="currentShortcut">Ctrl+Y</kbd>
        </p>
      </div>

      <hr style="border:none; border-top:1px solid #3f3f42; margin:20px 0;" />

      <div class="section">
        <h2>保存テンプレート</h2>
        <p>
          拡張機能ポップアップで作成したテンプレートを管理します。テンプレートは最大8個まで保存できます。
        </p>
        <p class="muted" style="font-size:13px;">
          コメント設定をオフにしても、既存テンプレートのコメントは削除されません。
        </p>
        <label class="check-row" for="templateIncludeComment">
          <input id="templateIncludeComment" type="checkbox" disabled />
          <span>テンプレート作成時にコメントも保存する</span>
        </label>
        <label class="check-row" for="templateAutoSave">
          <input id="templateAutoSave" type="checkbox" disabled />
          <span>テンプレート使用時にクリップも自動保存する</span>
        </label>
        <p id="templateCount" class="muted template-count">テンプレート：0 / 8</p>
        <div id="templateList" class="template-list"></div>
        <div id="templateStatus" class="option-status" role="status" aria-live="polite" hidden></div>
      </div>

      <div class="section">
        <label>保存先サーバー</label>
        <p>
          バックエンドサーバーが <code>http://127.0.0.1:8000</code>
          で起動している必要があります。
        </p>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
