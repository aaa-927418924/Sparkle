<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div class="title-row">
        <h1 class="title">クリップを保存</h1>
        <div id="templateSlots" class="template-slots" aria-label="保存テンプレート"></div>
      </div>

      <div class="field">
        <label>ページ</label>
        <div id="page" class="page">
          <span id="pageTitle" class="page-title">取得中…</span>
          <span id="pageUrl" class="page-url"></span>
        </div>
      </div>

      <div class="field suggest-field">
        <div class="tag-head-row">
          <label>タグ</label>
          <div id="tagBox" class="tag-box"></div>
        </div>
        <div class="suggest-wrap">
          <input id="tagInput" type="text" placeholder="タグを入力してEnter" autocomplete="off" />
          <div id="tagSuggest" class="suggest-list" hidden></div>
        </div>
      </div>

      <div class="field">
        <label>サムネイル</label>
        <div id="thumbPreviewWrap" class="thumb-preview-wrap" hidden>
          <img id="thumbPreview" class="thumb-preview" alt="" />
        </div>
        <div class="thumb-btn-row">
          <button id="pickThumb" type="button" class="thumb-btn">🖼 クリックでサムネイルを選択</button>
          <button id="thumbReset" type="button" class="thumb-btn ghost" hidden>↺ デフォルトに戻す</button>
        </div>
      </div>

      <div class="field">
        <label>コメント</label>
        <textarea id="comment" rows="2" placeholder="メモを入力…"></textarea>
      </div>

      <div class="field suggest-field category-suggest-field">
        <label for="category">カテゴリ</label>
        <div class="suggest-wrap category-suggest-wrap">
          <input
            id="category"
            type="text"
            placeholder="カテゴリ名"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-haspopup="listbox"
            aria-controls="categorySuggest"
            aria-expanded="false"
          />
          <div
            id="categorySuggest"
            class="suggest-list"
            hidden
            role="listbox"
            aria-label="カテゴリの入力履歴"
          ></div>
        </div>
      </div>

      <div class="action-row">
        <label class="fav">
          <input id="favorite" type="checkbox" /> お気に入りに追加
        </label>
        <button id="addTemplate" type="button" class="template-add" disabled>テンプレートとして追加</button>
      </div>

      <div id="templateEditor" class="template-editor" hidden>
        <div class="template-editor-heading">テンプレートを作成</div>
        <label for="templateTitle">表示タイトル</label>
        <input
          id="templateTitle"
          type="text"
          maxlength="40"
          placeholder="例：技術記事"
          autocomplete="off"
        />
        <p id="templateSummary" class="template-summary"></p>
        <p id="templateCommentSummary" class="template-summary"></p>
        <div class="template-editor-actions">
          <button id="templateCancel" type="button" class="template-btn ghost">キャンセル</button>
          <button id="templateCreate" type="button" class="template-btn">保存</button>
        </div>
        <div id="templateEditorStatus" class="template-editor-status" role="status" aria-live="polite" hidden></div>
      </div>

      <div class="save-row">
        <button id="save" class="save">保存</button>
        <div id="status" class="status" hidden></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
